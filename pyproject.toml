[project]
name = "file-organizer"
version = "0.1.0"
description = "Organize a messy folder into type- or date-based subfolders from the command line."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "David Frank" }]
keywords = ["cli", "files", "organizer", "automation", "productivity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
file-organizer = "fileorganizer.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fileorganizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
